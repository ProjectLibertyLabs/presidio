name: Build and Publish Image to ICS Production ECR
concurrency:
  group: build-ics-prod-ecr-${{github.ref}}
  cancel-in-progress: true
on:
  push:
    branches:
      - _prod
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  AWS_REGION: us-east-2
  DOCKER_PLATFORMS: linux/amd64

jobs:
  build-publish-docker-images:
    name: Build and Publish to ICS Production ECR
    # Push triggers are restricted to _prod. Manual dispatch (workflow_dispatch) is always
    # allowed but the checkout below is pinned to _prod so it always builds from prod code.
    if: github.ref == 'refs/heads/_prod' || github.event_name == 'workflow_dispatch'
    env:
      DOCKER_REGISTRY: ${{secrets.ICS_PROD_AWS_ACCOUNT}}.dkr.ecr.us-east-2.amazonaws.com
      AWS_OIDC_ROLE: ${{secrets.ICS_PROD_AWS_GITHUB_OIDC_ROLE_ARN}}
      BRANCH_NAME: _prod
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ["presidio-analyzer"]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v5
        with:
          ref: _prod
      - name: Derive Short SHA
        id: short-sha
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          echo "short_sha=$short_sha" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{env.AWS_OIDC_ROLE}}
          aws-region: ${{env.AWS_REGION}}
      - name: Current AWS Identity
        run: aws sts get-caller-identity
      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{env.DOCKER_REGISTRY}}
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - name: Build and Push
        uses: docker/build-push-action@v6
        env:
          ECR_NAMESPACE: ics-prod/pii-analyzer
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: presidio-analyzer
          file: ${{matrix.service}}/Dockerfile.privacy-filter
          platforms: ${{env.DOCKER_PLATFORMS}}
          push: true
          tags: |
            ${{env.DOCKER_REGISTRY}}/${{env.ECR_NAMESPACE}}:latest
            ${{env.DOCKER_REGISTRY}}/${{env.ECR_NAMESPACE}}:${{env.BRANCH_NAME}}-${{steps.short-sha.outputs.short_sha}}-${{github.run_number}}
