supported_languages:
  - en
global_regex_flags: 26
recognizers:
  - name: SpacyRecognizer
    type: predefined
    supported_languages:
      - en
    enabled: false

  - name: PrivacyFilterRecognizer
    class_name: PrivacyFilterONNXRecognizer
    type: predefined
    supported_languages:
      - en
    score_threshold: 0.0
    target_entities:
      - PERSON
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - DOB
      - SECRET
      - CREDIT_CARD
    # account_number is intentionally not mapped: the privacy-filter model is
    # noisy on bare SSNs (often labels them "secret"). SSN detection is
    # delegated entirely to ContextAwareUsSsnRecognizer below.
    # private_date is intentionally not mapped: only spans promoted to `dob` by
    # the recognizer's DOB-context check are surfaced (matching the standalone
    # privacy-filter HTTP service); generic dates are dropped.
    entity_mapping:
      private_person: PERSON
      private_phone: PHONE_NUMBER
      private_email: EMAIL_ADDRESS
      private_address: LOCATION
      dob: DOB
      secret: SECRET
      credit_card: CREDIT_CARD

  - name: GLiNERFreeTextRecognizer
    class_name: EdgeONNXGLiNERRecognizer
    type: predefined
    supported_languages:
      - en
    model_name: knowledgator/gliner-pii-edge-v1.0
    onnx_model_file: onnx/model.onnx
    threshold: 0.45
    flat_ner: true
    multi_label: false
    map_location: cpu
    target_entities:
      - LOCATION
    entity_mapping:
      address: LOCATION

  - name: EmailRecognizer
    type: predefined
    supported_languages:
      - en

  # Re-enabled: PhoneRecognizer complements the privacy-filter model on
  # phone/fax-like strings the ONNX model misses. Analyzer-level routing
  # now collapses overlapping equivalent phone detections to avoid duplicate
  # precision hits in value-based evals.
  - name: PhoneRecognizer
    type: predefined
    supported_languages:
      - en

  - name: ContextAwareUsSsnRecognizer
    type: predefined
    supported_languages:
      - en
    min_score: 0.5
    low_score_require_context: true
    context_terms: [ssn, social security]
    context_window_chars: 80

  - name: CreditCardRecognizer
    type: predefined
    supported_languages:
      - language: en
        context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]

  - name: GLiNERPartialCardRecognizer
    type: predefined
    supported_languages:
      - en
    enabled: false
    model_name: knowledgator/gliner-pii-edge-v1.0
    onnx_model_file: onnx/model.onnx
    threshold: 0.25
    flat_ner: true
    multi_label: false
    map_location: cpu
    labels:
      - partial credit card
      - credit card ending digits
      - last 4 digits
    required_context_terms:
      - credit
      - debit
      - payment
      - charge
      - charged
      - transaction
      - billing
      - statement
      - fraud
      - mastercard
      - amex
    strong_context_terms:
      - credit
      - debit
      - payment
      - charge
      - charged
      - transaction
      - billing
      - statement
      - fraud
      - mastercard
      - amex
    blocklist_terms:
      - invoice
      - order
      - ticket
      - reservation
      - account
      - pin
      - otp
      - year
      - code
      - passport
      - green card
      - travel visa
